<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Habitude · Page export</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #0004; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(640px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: Canvas; color: CanvasText; border: 1px solid #8886; border-radius: 16px; padding: 24px; box-shadow: 0 20px 70px #0004; }
  header { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; } h2 { font-size: 17px; overflow-wrap: anywhere; }
  p { line-height: 1.6; font-size: 14px; opacity: .8; }
  textarea { width: 100%; height: 200px; padding: 14px; font: 13px/1.6 ui-monospace, monospace; border-radius: 8px; border: 1px solid #8888; background: Canvas; color: CanvasText; resize: vertical; }
  button, select { font: inherit; font-size: 14px; min-height: 44px; border: 1px solid #8888; border-radius: 8px; padding: 10px 14px; color: CanvasText; background: Canvas; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; } .primary { background: #7545c7; color: white; border-color: #7545c7; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; } .status { min-height: 24px; opacity: 1; } .error { color: #c1463a; }
</style>
<main aria-labelledby="heading">
  <header><h1 id="heading">Habitude</h1><button id="close" type="button">닫기 / Close</button></header>
  <div class="row"><label for="language">언어 / Language</label><select id="language"><option value="ko">한국어</option><option value="en">English</option></select></div>
  <h2 id="page-title"></h2><p id="explanation"></p>
  <label id="preview-label" for="preview">Markdown</label><textarea id="preview" readonly spellcheck="false"></textarea>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="row"><button id="download" class="primary" type="button" disabled>Markdown</button><button id="copy" type="button" disabled>Copy</button><button id="open" type="button">Open Habitude</button></div>
  <p id="next"></p>
</main>
<script src="vendor/lsplugin.user.js"></script><script src="index.js"></script>
</html>
